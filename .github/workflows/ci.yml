name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: npm audit (alta severidad, no bloquea)
        run: npm audit --audit-level=high || true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Los tests son unitarios (sqlite/archivos); no requieren Postgres real.
      APP_NAME: nails-studio
      ENV: test
      DATABASE_URL: sqlite://
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-clave-de-prueba-minimo-32-chars!!' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: pip-audit (no bloquea, solo reporta)
        run: pip install pip-audit && pip-audit || true
